---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  {% assign chars = page.content | strip_html | size %}
  <p class="post-meta">
    {{ page.date | date: "%Y-%m-%d" }} · {{ chars | divided_by: 400 | plus: 1 }} min read
  </p>

  <div class="entry">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>
